<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 建議改密碼提醒 — 提案</title>
<link rel="stylesheet" href="auth-tokens.css?v=20260807e">
<style>
  /* 跟 F1-Session逾時提醒-提案.html 同一套做法：這個 Modal 是全站共用元件，
     不屬於單一頁面，背景不是登入前版型。背景改用 iframe 直接載入已上線的
     「E8D 後台導覽結構原型」，不用自己拼假的側欄/內容佔位——PM 看到的
     背景是真實畫面，且原型之後更新這裡不用跟著手動同步 */
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: var(--font); background: var(--bg-page); color: var(--text-primary); }

  .bg-frame {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    border: none;
  }

  /* ---------- Modal（沿用設計系統 Modal 元件規格：Confirm 類型、無 ✕、sm 400） ---------- */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(26, 21, 18, .45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.show { display: flex; }

  .modal { width: 400px; max-width: calc(100vw - 48px); background: var(--neutral-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
  .modal-head { padding: var(--space-xl) var(--space-xl) var(--space-sm); }
  .modal-title { font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); color: var(--text-primary); }
  .modal-body { padding: 0 var(--space-xl) var(--space-lg); font-size: var(--fs-sm); line-height: 22px; color: var(--text-secondary); }
  .modal-foot { display: flex; justify-content: flex-end; gap: var(--space-sm); padding: var(--space-sm) var(--space-xl) var(--space-xl); }

  /* Modal 按鈕用元件庫的 Button Medium 規格（36px），跟登入前版型的 48px .btn-primary 不是同一套 */
  .m-btn {
    height: 36px; padding: 0 var(--space-lg);
    border-radius: var(--radius-md); font-family: var(--font);
    font-size: var(--fs-sm); font-weight: var(--fw-medium);
    border: 1px solid transparent; cursor: pointer;
  }
  .m-btn-primary { background: var(--primary-700); color: var(--neutral-white); }
  .m-btn-primary:hover { background: var(--primary-800); }
  .m-btn-secondary { background: var(--neutral-white); border-color: var(--border-default); color: var(--text-primary); }
  .m-btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-hover); }

  /* demo 控制（跟 auth 頁的 state-bar 是不同系統，這裡只是重新叫出 Modal 用） */
  .demo-bar {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; align-items: center; gap: var(--space-md);
    background: var(--neutral-black); color: var(--neutral-white);
    padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-full);
    box-shadow: var(--shadow-lg); font-size: var(--fs-micro); z-index: 200;
  }
  .demo-bar button {
    font-family: var(--font); font-size: var(--fs-micro); font-weight: var(--fw-medium);
    background: rgba(255,255,255,.14); color: var(--neutral-white);
    border: none; border-radius: var(--radius-full); padding: 6px 12px; cursor: pointer;
  }
  .demo-bar button:hover { background: rgba(255,255,255,.22); }
</style>
</head>
<body>

<iframe class="bg-frame" src="https://alvieforwork.github.io/e8d-nav-prototype/" title="E8D 後台導覽結構原型（背景示意，非本次設計重點）"></iframe>

<!-- 建議改密碼提醒 Modal：密碼超過設定天數未更新時，登入後疊在畫面上方。
     不強制——兩顆按鈕都只是關掉 modal，不會擋住使用者操作平台。
     「半年後再跳出來」這件事是後端記錄「使用者上次按了暫不變更的時間」，
     不是這個畫面要處理的邏輯，見下方 PASSWORD_AGE_DAYS 的說明 -->
<div class="modal-mask show" id="modalMask">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">建議更新密碼</div></div>
    <!-- 數字由下方 PASSWORD_AGE_DAYS 填入，跟 Session 逾時 modal 同一個做法，
         畫面不寫死；「不強制」用字面上的「建議」帶過，不用驚嘆號或警示色 -->
    <div class="modal-body">您的密碼已使用超過<span id="ageSpan">半年</span>，為了帳號安全，建議您定期更新密碼。</div>
    <div class="modal-foot">
      <!-- ⚠️「更新密碼」目前沒有真的頁面可以連——變更密碼頁歸在 F8（我的帳號設定），
           尚未動工。Alvie 2026-08-07 確認先讓這顆鈕跟「暫不變更」一樣單純關掉 modal，
           等 F8 那頁做出來後再把這裡換成真的連結，不要生一個假頁面出來墊檔 -->
      <button class="m-btn m-btn-secondary" id="laterBtn">暫不變更</button>
      <button class="m-btn m-btn-primary" id="updateBtn">更新密碼</button>
    </div>
  </div>
</div>

<div class="demo-bar">
  <span>demo</span>
  <button id="reopenBtn">重新顯示 Modal</button>
</div>

<script>
  /* ===== 可調整設定（2026-08-07）=====
     PASSWORD_AGE_DAYS — 密碼使用滿幾天觸發這個提醒，預設半年（180 天）。
     ⚠️ 這是 config 值不是寫死的規則，主管要調就改這一個數字。
     ⚠️ 「使用者按了暫不變更之後，下次半年到期才會再跳出來」——這條規則
        要靠後端記錄「上次提醒/上次變更密碼」的時間，原型沒有後端狀態，
        這裡只做「跳出來給你看」，不模擬真的半年週期。 */
  var PASSWORD_AGE_DAYS = 180;

  // 180 天整除 30 講「半年」比較好讀，其餘照天數講（例如未來若改成 90 天）
  function ageText(days) {
    return (days === 180) ? '半年' : days + ' 天';
  }
  document.getElementById('ageSpan').textContent = ageText(PASSWORD_AGE_DAYS);

  var mask = document.getElementById('modalMask');
  document.getElementById('reopenBtn').addEventListener('click', function () {
    mask.classList.add('show');
  });
  // 暫不變更：關掉提醒，留在原本畫面，不強制操作
  document.getElementById('laterBtn').addEventListener('click', function () {
    mask.classList.remove('show');
  });
  // 更新密碼：見上方註解，F8 變更密碼頁做出來前先跟「暫不變更」同行為
  document.getElementById('updateBtn').addEventListener('click', function () {
    mask.classList.remove('show');
  });
</script>

</body>
</html>
