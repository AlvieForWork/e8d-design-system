<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 強制變更密碼 — 提案</title>
<link rel="stylesheet" href="auth-tokens.css?v=20260803">
<script src="demo-mode.js?v=20260801"></script>
<style>
  /* 這頁獨有的版面樣式；顏色／間距／圓角／字級一律走 auth-tokens.css 的 token */

  /* 兩個密碼欄位是主角，貼成一組；規則清單緊接在下方當它們的註解 */
  .pw-group { margin-bottom: var(--space-lg); }
  .pw-group .field-float:last-child { margin-bottom: 0; }

  /* 卡片底部：目前登入的帳號 ＋ 登出出口。
     強制頁不給跳過，但要留「不是我／想換帳號」的路，
     用 12px 灰字壓低權重，不跟主按鈕搶 */
  .session-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 0;
    font-size: var(--fs-label); color: var(--text-secondary);
  }
  .session-row b {
    color: var(--text-primary); font-weight: var(--fw-semi);
  }
  .session-row .dot-sep { color: var(--neutral-300); }
  .session-row a {
    color: var(--text-secondary); text-decoration: none; font-weight: var(--fw-medium);
    transition: color .12s ease;
  }
  .session-row a:hover { color: var(--neutral-600); }

  /* 完成畫面與表單互斥切換 */
  .pane { display: none; }
  .pane.active { display: block; }
</style>
</head>
<body>

<div class="screen">

  <!-- 左側：資安意象（四頁共用，直接沿用登入頁那段） -->
  <div class="visual-panel">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>

    <div class="visual-spacer-top" aria-hidden="true"></div>
    <img class="visual-logo" src="logo_every8d_dark.svg" alt="EVERY8D">
    <div class="visual-spacer-mid" aria-hidden="true"></div>
    <div class="visual-copy">
      <h1 class="visual-heading">每一次登入，<br>都經過<em>多重防護</em>驗證</h1>
      <p class="visual-sub">帳號安全是我們最基本的承諾，從登入到每一則簡訊發送，全程受到嚴密保護。</p>
    </div>
    <div class="visual-spacer-bottom" aria-hidden="true"></div>
  </div>

  <!-- 右側：卡片 -->
  <div class="form-panel">
    <div class="auth-card">

      <!-- 首次登入的完整 stepper（跨頁）：設定密碼 → 驗證手機 → 保存備用碼 → 完成。
           這頁是步驟①，②③在 F1-2FA綁定引導-提案.html 接續，共用同一套 .steps 元件，
           只有首次登入情境顯示（密碼過期是既有帳號、不需要再走 2FA 設定，見 applyScene）-->
      <div class="steps" id="steps">
        <div class="step current" data-step="1">
          <span class="step-dot">
            <span class="num">1</span>
            <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span><span class="step-label">設定密碼</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="2">
          <span class="step-dot">
            <span class="num">2</span>
            <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span><span class="step-label">驗證手機</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="3">
          <span class="step-dot">
            <span class="num">3</span>
            <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span><span class="step-label">保存備用碼</span>
        </div>
      </div>

      <!-- ========== 設定新密碼 ========== -->
      <div class="pane active" id="paneForm">
        <h1 id="pageTitle">設定您的密碼</h1>
        <p class="subtitle" id="pageSub">這是您第一次登入，請設定一組專屬密碼後開始使用。</p>

        <div class="pw-group">
          <div class="field-float" id="pwField">
            <input id="pw" class="has-icon" type="password" placeholder=" " autocomplete="new-password">
            <label for="pw">新密碼</label>
            <span class="eye-toggle" data-target="pw">
              <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </span>
          </div>

          <div class="field-float" id="pw2Field">
            <input id="pw2" class="has-icon" type="password" placeholder=" " autocomplete="new-password">
            <label for="pw2">確認新密碼</label>
            <span class="eye-toggle" data-target="pw2">
              <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- 送出後才會知道的錯誤（兩次不一致、與舊密碼相同）走這裡 -->
        <div class="msg" id="msg">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
          </svg>
          <span id="msgText"></span>
        </div>

        <!-- 規則清單只放前端能即時判斷的三條。
             「不可與目前密碼相同」前端拿不到舊密碼，無法即時打勾，
             硬放進來會出現一條永遠不會變綠的規則 → 改由送出後的錯誤訊息負責 -->
        <ul class="rules" id="rules">
          <li data-rule="len">
            <span class="dot">
              <svg class="circle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
              <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            至少 8 個字元
          </li>
          <li data-rule="alpha">
            <span class="dot">
              <svg class="circle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
              <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            包含英文字母
          </li>
          <li data-rule="num">
            <span class="dot">
              <svg class="circle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
              <svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            包含數字
          </li>
        </ul>

        <button class="btn btn-primary" id="submitBtn" disabled><span id="submitLabel">設定密碼</span></button>

        <div class="footer-divider"></div>
        <!-- 強制頁不給跳過，但要留「不是我／想換帳號」的出口 -->
        <p class="session-row">
          目前登入帳號 <b>emma</b>
          <span class="dot-sep">·</span>
          <a href="#" id="logoutLink">登出</a>
        </p>
      </div>

      <!-- ========== 完成 ========== -->
      <div class="pane" id="paneDone">
        <div class="result-hero">
          <div class="circle">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <h1 id="doneTitle">密碼已設定完成</h1>
          <p>下次登入請使用新密碼。建議搭配密碼管理工具保存，避免重複使用其他網站的密碼。</p>
        </div>

        <button class="btn btn-primary" id="enterBtn"><span>進入平台</span></button>
      </div>

    </div>
  </div>

</div>

<!-- demo 狀態列（正式產品不會有） -->
<div class="state-bar">
  <span class="tag">觸發情境</span>
  <button data-state="first" class="active">首次登入</button>
  <button data-state="expired">密碼過期</button>
  <span class="sep"></span>
  <span class="tag">狀態</span>
  <button data-state="mismatch">兩次不一致</button>
  <button data-state="samepw">與舊密碼相同</button>
  <button data-state="loading">送出中</button>
  <button data-state="done">完成</button>
</div>

<script>
(function () {
  var paneForm   = document.getElementById('paneForm');
  var paneDone   = document.getElementById('paneDone');
  var pageTitle  = document.getElementById('pageTitle');
  var pageSub    = document.getElementById('pageSub');
  var pw         = document.getElementById('pw');
  var pw2        = document.getElementById('pw2');
  var pwField    = document.getElementById('pwField');
  var pw2Field   = document.getElementById('pw2Field');
  var msg        = document.getElementById('msg');
  var msgText    = document.getElementById('msgText');
  var rules      = document.getElementById('rules');
  var submitBtn  = document.getElementById('submitBtn');
  var submitLabel= document.getElementById('submitLabel');
  var stepsEl    = document.getElementById('steps');

  /* ---- 兩種觸發情境：同一個版型，只換標題與說明 ----
     首次登入／密碼過期靠副標一句話就講得完。
     2026-07-31：原本還有「資安重設」情境（需求未定案，已移除，
     待需求明確再補回來，不要憑印象先做） */
  var SCENES = {
    first: {
      title: '設定您的密碼',
      sub:   '這是您第一次登入，請設定一組專屬密碼後開始使用。',
      btn:   '設定密碼',
      done:  '密碼已設定完成'
    },
    expired: {
      title: '密碼已過期',
      sub:   '依資安政策，密碼每 <b>90 天</b>需更新一次。更新後即可繼續使用。',
      btn:   '更新密碼',
      done:  '密碼已更新'
    }
  };
  var scene = 'first';

  function applyScene(key) {
    scene = key;
    var s = SCENES[key];
    pageTitle.textContent = s.title;
    pageSub.innerHTML = s.sub;
    pageSub.style.display = s.sub ? '' : 'none';
    submitLabel.textContent = s.btn;
    // stepper 只在首次登入顯示：密碼過期是既有帳號、2FA 早就設定過，不會再走一次
    stepsEl.style.display = key === 'first' ? '' : 'none';
  }

  /* ---- 規則即時檢核 ---- */
  var ruleTests = {
    len:   function (v) { return v.length >= 8; },
    alpha: function (v) { return /[A-Za-z]/.test(v); },
    num:   function (v) { return /\d/.test(v); }
  };

  function checkRules() {
    var v = pw.value;
    var allPass = true;
    Array.prototype.slice.call(rules.children).forEach(function (li) {
      var ok = ruleTests[li.dataset.rule](v);
      li.classList.toggle('pass', ok);
      if (!ok) allPass = false;
    });
    // 兩欄都有值且三條規則都過才啟用；是否一致留到送出才判斷，
    // 邊打邊跳「不一致」會在使用者還沒打完時就先罵人
    submitBtn.disabled = !(allPass && pw2.value.length > 0);
  }

  function clearError() {
    msg.classList.remove('show', 'error');
    pwField.classList.remove('is-error');
    pw2Field.classList.remove('is-error');
  }

  function showError(text, which) {
    msg.classList.add('show', 'error');
    msgText.innerHTML = text;
    if (which === 'both' || which === 'pw')  pwField.classList.add('is-error');
    if (which === 'both' || which === 'pw2') pw2Field.classList.add('is-error');
  }

  pw.addEventListener('input',  function () { clearError(); checkRules(); });
  pw2.addEventListener('input', function () { clearError(); checkRules(); });

  /* ---- 顯示／隱藏密碼 ---- */
  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('.eye-toggle');
    if (!toggle) return;
    var target = document.getElementById(toggle.dataset.target);
    var reveal = target.type === 'password';
    target.type = reveal ? 'text' : 'password';
    toggle.classList.toggle('revealed', reveal);
  });

  /* ---- 送出 ---- */
  function setLoading(on) {
    pwField.classList.toggle('is-disabled', on);
    pw2Field.classList.toggle('is-disabled', on);
    if (on) {
      submitBtn.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';
    } else {
      submitLabel.textContent = SCENES[scene].btn;
      checkRules();   // 解除載入後由規則決定能不能按，不可無條件放行
    }
  }

  submitBtn.addEventListener('click', function () {
    if (pw.value !== pw2.value) {
      showError('兩次輸入的密碼不一致', 'pw2');
      return;
    }
    setLoading(true);
    setTimeout(function () {
      setLoading(false);
      showDone();
      syncBar('done');
    }, 1200);
  });

  function showDone() {
    // 完成頁標題跟著情境走：首次登入是「設定」，過期／重設是「更新」
    document.getElementById('doneTitle').textContent = SCENES[scene].done;
    paneForm.classList.remove('active');
    paneDone.classList.add('active');
  }
  function showForm() {
    paneDone.classList.remove('active');
    paneForm.classList.add('active');
  }

  document.getElementById('enterBtn').addEventListener('click', function () {
    // happy path B（首次登入）：設完新密碼接著強制走 2FA 設定，不是直接進平台
    window.location.href = 'F1-2FA綁定引導-提案.html';
  });

  /* ---- demo 狀態切換 ---- */
  function resetForm() {
    pw.value = ''; pw2.value = '';
    pw.type = 'password'; pw2.type = 'password';
    Array.prototype.slice.call(document.querySelectorAll('.eye-toggle')).forEach(function (t) {
      t.classList.remove('revealed');
    });
    clearError();
    checkRules();
    setLoading(false);
  }

  var btns = Array.prototype.slice.call(document.querySelectorAll('.state-bar button'));
  function syncBar(state) {
    btns.forEach(function (b) { b.classList.toggle('active', b.dataset.state === state); });
  }

  function setState(s) {
    // 情境切換：回到乾淨表單
    if (SCENES[s]) { showForm(); resetForm(); applyScene(s); return; }

    showForm();

    if (s === 'mismatch') {
      resetForm();
      pw.value = 'every8d2026'; pw2.value = 'every8d2O26';
      checkRules();
      showError('兩次輸入的密碼不一致', 'pw2');
    }

    if (s === 'samepw') {
      // 強制變更密碼最常見的擋點：使用者原地填回同一組密碼
      resetForm();
      pw.value = 'every8d2026'; pw2.value = 'every8d2026';
      checkRules();
      showError('新密碼不可與目前使用的密碼相同', 'both');
    }

    if (s === 'loading') {
      resetForm();
      pw.value = 'every8d2026'; pw2.value = 'every8d2026';
      checkRules();
      setLoading(true);
    }

    if (s === 'done') { showDone(); }
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      syncBar(b.dataset.state);
      setState(b.dataset.state);
    });
  });

  applyScene('first');
  checkRules();
})();
</script>

</body>
</html>
