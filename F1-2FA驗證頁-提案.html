<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2FA 簡訊驗證頁 — 提案</title>
<link rel="stylesheet" href="auth-tokens.css?v=20260819a">
<script src="demo-mode.js?v=20260801"></script>
<script src="otp-shared.js?v=20260820b"></script>
<style>

  /* 表單／驗證已逾時互斥切換 */
  .pane { display: none; }
  .pane.show { display: block; }

  /* ---------- 左側：資安意象 ---------- */
  /* ---- 會飄動的光暈 ---- */
  /* 每團光就是一個模糊的橘色圓形，靠 transform 緩慢位移來製造流動感 */
  /* 每團光就是一個模糊的橘色圓形，靠 transform 緩慢位移來製造流動感 */
  /* 時間全部由 JSON 的 speed:28 推算：28s 為基準，另外兩團錯開成 36s / 44s */

  /* 使用者若在系統開了「減少動態效果」，就自動停下來 */

  /* 顆粒質感：用 SVG 濾鏡即時產生，取代原本 45KB 的 base64 貼圖 */
  /* 用彈性空白撐開版面比例，跟著面板高度縮放，不寫死 px。
     比例 1 : 2.2 : 2.1（頂→logo、logo→標語、標語→底），量自參考版型：
     logo 落在約 18% 高度、標語落在約 50%，底部留最大一片空白 */
  /* 標題全白，橘色留給右邊的登入按鈕當唯一焦點 */

  /* ---------- 右側：卡片 ---------- */
  .subtitle a {
    color: var(--text-link); text-decoration: none;
    transition: color .12s ease;
  }
  .subtitle a:hover { color: var(--info-700); }
  /* 「進站即鎖定」訊息裡的「聯絡客服」：蓋掉上面 .subtitle a 的藍色連結樣式。
     這句話本身是紅字（.locked 繼承 --text-error），連結該跟著同色，
     不是另外開一個藍色出口——一句紅字裡混一個藍連結會變成兩個色系在打架。
     樣式跟其他鎖定訊息裡的客服連結（auth-tokens.css 的 .msg a）統一：不加底線。

     hover 效果改了四次：① brightness(0.85) 壓暗——暗下去的紅偏濁（豬肝紅）；
     ② 淡底色 highlight——Alvie 看過覺得不需要那個框；③ filter:saturate(1.5)——
     方向對但在已經很飽和的紅上幾乎看不出差異；④ 現在：Alvie 指定固定色碼
     #E42C2F 試看看，比 --text-error 略深一點、彩度也收一點，兩色並排比較過
     看起來自然，跟共用檔的 .msg a:hover 用同一個色碼 */
  .subtitle .locked a {
    color: inherit; font-weight: var(--fw-semi);
    text-decoration: none; cursor: pointer;
    transition: color .12s ease;
  }
  /* ⚠️ hover 用固定色碼而不是 color:inherit，剛好順便解掉另一個問題——
     auth-tokens.css 裡還有一條 .auth-card .subtitle a:hover{color:var(--info-700)}
     （給一般藍色連結用），特異度跟這條打平；這裡直接指定色碼會贏過那條
     （2026-08-06 用 filter 版本時就已經抓到這個坑，重申一次 color 才會贏） */
  .subtitle .locked a:hover {
    color: #E42C2F;
  }

  /* ---- 6 格驗證碼 ---- */
  .otp-row input::-webkit-outer-spin-button,
  .otp-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* 錯誤狀態 */
  @media (prefers-reduced-motion: reduce) { .otp-row.is-error { animation: none; } }

  /* 驗證中：整排變淡不可點 */

  /* 2026-08-05：備用碼輸入框（.backup-field）的樣式全部移除 */

  /* OTP 輸入框之後那一段（錯誤提示／重發／信任裝置／驗證鈕）的間距系統
     （.otp-footer flex+gap）2026-08-07 搬進 auth-tokens.css 共用，
     三個 OTP 頁一起套用，這裡不再重複定義——理由跟坑點的完整說明也搬過去了 */

  /* 「信任這個裝置」在這頁要當次要選項，不能跟 OTP 輸入／驗證鈕搶視覺重心。
     只調整未勾選時的顏色（比預設的 --text-secondary 再淡一階，
     跟這頁重發區的提示字同一色階），勾選後的橘色照舊不變——
     勾了就該清楚看到「已啟用」，弱化只該發生在靜態未勾選時。
     ⚠️ 不動 checkbox 尺寸——那是系統元件既定規格，不為單一頁面另開一個尺寸變體 */
  .check-line-subtle { color: var(--text-disabled); }
  .check-line-subtle .box { border-color: var(--border-default); }
  /* 2026-08-06 校正：天數原本用 <b> 加粗加深，跟說明句的「值」同一套處理——
     但 Alvie 指出這裡不該有任何強調：這行本身已經是次要元素，
     加粗的數字容易讓使用者誤以為那是可以點的東西。
     改成純 <span>（純標籤沒有預設粗體，不用另外蓋 CSS），
     整行自然繼承同一種字重、同一個顏色，不再特別標出「30」 */

  </style>
</head>
<body>

<div class="screen">

  <!-- 左側：品牌區（所有登入前頁面共用同一份） -->
  <div class="visual-panel">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>

    <div class="visual-spacer-top" aria-hidden="true"></div>
    <img class="visual-logo" src="logo_every8d_dark.svg" alt="EVERY8D">
    <div class="visual-spacer-mid" aria-hidden="true"></div>
    <div class="visual-copy">
      <h1 class="visual-heading">每一次登入，<br>都經過<em>多重防護</em>驗證</h1>
      <p class="visual-sub">帳號安全是我們最基本的承諾，從登入到每一則簡訊發送，全程受到嚴密保護。</p>
    </div>
    <div class="visual-spacer-bottom" aria-hidden="true"></div>
  </div>

  <!-- 右側：驗證卡片 -->
  <div class="form-panel">
    <div class="auth-card">

      <div class="pane show" id="formPane">

      <a class="back-link" href="#" id="backLink">
        <!-- Lucide: arrow-left -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
        </svg>
        返回登入
      </a>

      <!-- 2026-08-06：三個 OTP 頁的標題統一成「簡訊驗證」（原本這頁「簡訊驗證碼」、
           首次設定「驗證您的手機號碼」、忘記密碼「輸入驗證碼」，三頁各叫各的）。
           統一的理由：三頁的使用者動作完全一樣（看簡訊→選代碼→打驗證碼），
           標題不同會讓人以為要做不同的事——使用者不會去分析「這頁目的是綁定
           還是驗證身分」。
           選「簡訊驗證」而不是「雙重驗證」：它講的是**管道**不是機制，
           三個情境都成立；「雙重驗證」在忘記密碼流程並不成立（那條路徑沒有
           前一重密碼，只有手機這一重）。
           接 SafeSay 後簡訊只帶連結，但起點仍是簡訊、使用者的動作也仍是
           「去看簡訊」，所以講管道依然準確。
           ⚠️ 語序不可寫成「驗證簡訊」——那讀起來是名詞（一封簡訊），
              「簡訊驗證」才是「透過簡訊驗證」的動作語氣 -->
      <!-- 2026-08-20：標題「簡訊驗證」→「身分驗證」。SafeSay 有兩條取碼路徑——
           裝了 SafeSay App 的人是 App 自動開啟、直接在聊天室收到代碼與驗證碼，
           沒裝的才會收到帶連結的簡訊去領——講「簡訊驗證」只涵蓋其中一條，
           對裝了 App 的人是錯的。改講這件事的目的（驗證是本人）而非管道，兩條路都成立。
           ⚠️ 三個 OTP 頁必須同步，不可只改一頁 -->
      <h1>身分驗證</h1>
      <!-- 有效時間串進同一句、同一行，不再另起一行。
           #validitySec 這個節點不可被 innerHTML 整段重寫——otp-shared.js 啟動時
           只抓過一次參照，重建的話倒數會更新到「已經不在畫面上」的舊節點，
           畫面上的新節點永遠停在 180 不動（2026-08-04 實測抓到過一次）。
           2026-08-05：交易代碼從這句拿掉——代碼改成四選一之後，
           顯示在這裡等於把答案寫在題目旁邊。
           2026-08-06 接 SafeSay：簡訊改成只帶連結、碼要去 SafeSay 讀取，
           所以「已發送」補上受詞變「已發送簡訊」，並補上最關鍵卻一直沒講的
           那一步「點簡訊中的連結」——不講的話使用者會盯著簡訊等數字。
           ⚠️ 這裡的 180 只是佔位，實際數字由 otp-shared.js 的
           OTP_VALIDITY_SEC 填入，要調秒數改那裡就好 -->
      <!-- 引導句連同它前面的 <br> 一起包進 #guideLine：鎖定狀態要整段收起來
           （沒有碼可以取，留著那句只會叫使用者去做一件做不到的事） -->
      <!-- 2026-08-20 SafeSay 兩種取碼方式：「已發送簡訊至」→「已發送驗證至」
           （裝了 App 的人收到的不是簡訊，說「簡訊」等於講錯管道）；
           引導句改成一次把兩條路講完：「請透過 SafeSay 取得英文代碼與驗證碼
           （已安裝將自動開啟，未安裝請點簡訊連結）：」。
           ⚠️ 三頁的標題／副標／「沒收到驗證？」必須逐字一致 -->
      <p class="subtitle" id="cardSubtitle"><span class="validity" id="validityWrap"><span class="normal">已發送驗證至 <b>0912****347</b>，有效時間 <b id="validitySec">180</b> 秒。</span><span class="expired">驗證碼已失效，請重新發送。</span><span class="locked">錯誤次數過多，請<a href="#" class="js-support">聯絡客服</a>協助解鎖</span></span><span id="guideLine"><br>請透過 <b>SafeSay</b> 取得英文代碼與驗證碼（已安裝將自動開啟，未安裝請點簡訊連結）：</span></p>

      <!-- 驗證代碼四選一（2026-08-05）：從四個裡挑出簡訊上收到的那一組。
           選項由 otp-shared.js 的 initCodeChoice() 產生並每次洗牌，三頁共用同一份 -->
      <div class="code-choice-row" id="codeChoiceRow" role="radiogroup" aria-label="驗證代碼"></div>

      <!-- 6 格驗證碼 -->
      <div class="otp-row" id="otpRow">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 1 碼">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 2 碼">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 3 碼">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 4 碼">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 5 碼">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="驗證碼第 6 碼">
      </div>

      <!-- 2026-08-06：錯誤提示／重發／信任裝置／驗證鈕，統一收進一個 flex column
           容器用 gap 控制間距（原因見上方 <style> 裡 .otp-footer 的說明）。

           這裡也拿掉了原本重發過一次才出現的「還是收不到簡訊？聯絡客服」——
           客服入口收斂成只留鎖定訊息裡的那個連結（Alvie 2026-08-06 定），
           不在正常流程中再另開一個入口。
           ⚠️ 這代表：使用者若一直收不到簡訊、卻沒有錯誤地打過驗證碼，
              現在沒有辦法觸發鎖定，也就摸不到客服入口——這個缺口有跟 Alvie 提過。 -->
      <div class="otp-footer" id="otpFooter">

        <!-- 錯誤訊息：跟其他頁共用同一個 .msg 元件（原本這裡自己刷了 .error-msg，已統一） -->
        <div class="msg" id="errorMsg">
          <!-- Lucide: circle-alert -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
          </svg>
          <span id="errorText">驗證碼錯誤，還可以再嘗試 4 次</span>
        </div>

        <!-- 重新發送 -->
        <div class="resend-row" id="resendRow"></div>

        <!-- 2026-08-06：信任這個裝置。2FA 強制啟用、每次登入都要驗，
             這個勾選是唯一能讓常用電腦不必天天收簡訊的機制。
             **只有日常登入這頁有**——首次設定那頁在綁手機（還沒有裝置可信任），
             忘記密碼那頁不是登入，兩者都不該出現。
             位置刻意放在主按鈕正上方：它是「按下驗證時要一起送出的選項」，
             離送出動作最近才讀得通。
             樣式用 .check-line-subtle（見上方 <style>）淡化成次要選項，
             不跟 OTP 輸入／驗證鈕搶視覺重心。
             天數由 otp-shared.js 的 TRUST_DEVICE_DAYS 填入，畫面不寫死 -->
        <label class="check-line check-line-subtle" id="trustDevice">
          <input type="checkbox">
          <span class="box">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </span>
          <span>信任這個裝置，<span id="trustDays">30</span> 天內不再驗證</span>
        </label>

        <button class="btn btn-primary" id="submitBtn" disabled>
          <span id="submitLabel">驗證</span>
        </button>

      </div>

      <!-- 2026-08-05：底部「收不到簡訊？改用備用碼」整行（含分隔線）移除 -->

      </div>

      <!-- 2026-08-05：移除「驗證已逾時」獨立畫面。碼過期改成就地提示
           （說明句換成「驗證碼已失效，請重新發送」＋重發鈕變可按），
           使用者不用被丟到另一頁再重走一次流程 -->
    </div>
  </div>

</div>

<!-- 狀態切換工具列（僅 demo 用） -->
<div class="state-bar">
  <span class="tag">狀態</span>
  <button data-state="default" class="active">輸入中</button>
  <button data-state="counting">倒數重發</button>
  <button data-state="error">驗證失敗</button>
  <button data-state="locked">錯誤達上限</button>
  <!-- 「錯誤達上限」是當場錯滿那一刻；這顆是隔天／重整後再進來看到的樣子，兩者畫面不同 -->
  <button data-state="locked-return">已鎖定（重整後）</button>
  <button data-state="expired">驗證碼已失效</button>
</div>

<script>
(function () {
  var CORRECT_OTP = '123456'; // demo 用固定正確碼，方便測試成功路徑
  var errorMsg   = document.getElementById('errorMsg');
  var errorText  = document.getElementById('errorText');
  var resendRow  = document.getElementById('resendRow');
  var submitBtn  = document.getElementById('submitBtn');
  var submitLbl  = document.getElementById('submitLabel');
  var formPane   = document.getElementById('formPane');

  /* ---------- 簡訊 OTP：六格輸入／輸錯鎖定／重發兩態／碼過期，改用共用模組
     （otp-shared.js）——跟找回帳密頁、2FA 綁定引導頁同一套邏輯，不再自己寫一份。
     2026-08-05：備用碼移除後這頁只剩簡訊一種模式，送出按鈕交回共用模組
     自動綁定（原本的 autoBindVerifyClick:false 是為了 sms/backup 分流才需要） */
  var otp;
  // 驗證代碼四選一：正解由 otp-shared.js 的 CORRECT_TX_CODE 決定（demo 固定 ABC，
  // 跟六位數固定 123456 同一個道理）。選了碼要回頭叫 otp.recheck()，
  // 否則「先填滿六格、後選代碼」這個順序不會自動送出
  var codeChoice = initCodeChoice({
    row: document.getElementById('codeChoiceRow'),
    // 選完代碼把游標接到還沒填的那一格：點按鈕會把焦點吃掉，不接的話使用者還要自己再點一次
    onChange: function () { if (otp) { otp.recheck(); otp.focusNextEmpty(); } }
  });

  otp = initOtpVerifier({
    otpRow: document.getElementById('otpRow'),
    verifyBtn: submitBtn,
    verifyLabelEl: submitLbl,
    errorBox: errorMsg,
    errorTextEl: errorText,
    resendRow: resendRow,
    validityEl: document.getElementById('validitySec'),
    validityWrap: document.getElementById('validityWrap'),
    codeChoice: codeChoice,
    // 2026-08-06：次數不再逐頁傳，統一由 otp-shared.js 的 OTP_MAX_ATTEMPTS 供給（3 次）
    checkCode: function (code) { return code === CORRECT_OTP; },
    // 2026-08-06：有效時間不再逐頁傳，統一由 otp-shared.js 的 OTP_VALIDITY_SEC 供給。
    // 接 SafeSay 後這個秒數很可能要調高（使用者得離開畫面去領碼），改一個地方三頁同步
    onSuccess: showSuccess,
    // 鎖定時「信任這個裝置」也要一起停用——這頁被鎖之後唯一還能做的事
    // 只有聯絡客服，留一個亮著、勾了也沒用的選項只會誤導
    onLock:   function () { setTrustDisabled(true); },
    onUnlock: function () { setTrustDisabled(false); }
  });

  var trustDevice = document.getElementById('trustDevice');
  var trustInput  = trustDevice.querySelector('input');
  function setTrustDisabled(on) {
    trustDevice.classList.toggle('is-disabled', on);
    trustInput.disabled = on;
    if (on) trustInput.checked = false;
  }

  /* ---------- 「已鎖定」進站狀態（2026-08-06）----------
     使用者輸錯達上限之後**重新整理再回到這一頁**會看到的畫面。

     這跟「當場錯滿第 3 次」不是同一件事：那一刻有抖動動畫、有剛扣掉的次數；
     重整回來則是靜靜地一進站就鎖著，而且**系統沒有再發簡訊**——
     所以說明句要從「已發送驗證至…，有效時間 NNN 秒」換成「此帳號的簡訊驗證已鎖定」，
     引導句整段收起來，重發那行清空（不清的話重整一次就能多送一則簡訊）。

     真實系統靠後端查帳號的鎖定狀態；原型沒有後端，用網址 ?locked=1 模擬。
     ⚠️ 這也是為什麼鎖定必須綁在帳號上（後端）而不是頁面狀態——
        現在原型重整就歸零，正式實作照著做的話等於沒鎖。 */
  var validityWrap = document.getElementById('validityWrap');
  var guideLine    = document.getElementById('guideLine');
  function showLockedOnLoad() {
    otp.lock();
    validityWrap.classList.add('is-locked');
    guideLine.style.display = 'none';
    /* 下方那條紅色錯誤訊息要收掉——說明句已經把「錯太多次、鎖了、怎麼辦」
       三件事一次講完，留著等於同一件事講兩次，而且一張卡片出現兩段紅字太重。
       （當場錯滿那一刻不一樣：那時說明句還是「已發送驗證至…」，
        錯誤訊息是唯一在講鎖定的地方，必須留著） */
    errorMsg.classList.remove('show', 'error');
  }
  function clearLockedOnLoad() {
    validityWrap.classList.remove('is-locked');
    guideLine.style.display = '';
  }

  function showSuccess() {
    // 2026-07-31：拿掉「登入成功」中繼頁。登入是進門，不是任務完成，
    // 驗證通過直接進平台，不停留讓使用者再點一次
    // 2026-07-31：改用完整網址（GitHub Pages 部署），本機相對路徑 PM 打不開
    window.location.href = 'https://alvieforwork.github.io/e8d-nav-prototype/';
  }

  /* 2026-08-05：備用碼模式整段移除（輸入框、獨立的 5 次計數、跟綁定引導頁
     用 localStorage 對答案的那套、sms/backup 雙模式的 setMode()）。
     送出按鈕不再需要依模式分流，改回交給共用模組自動綁定
     ——見上面 initOtpVerifier() 已拿掉的 autoBindVerifyClick:false。 */

  /* ---------- demo 狀態切換 ---------- */
  var stateButtons = Array.prototype.slice.call(document.querySelectorAll('.state-bar button'));

  function syncStateBar(name) {
    stateButtons.forEach(function (b) {
      b.classList.toggle('active', b.dataset.state === name);
    });
  }

  stateButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var s = this.dataset.state;
      syncStateBar(s);
      // 先把「已鎖定進站」的說明句還原，否則切到別的狀態時那句話會殘留
      clearLockedOnLoad();

      // 鎖定後重新整理再進來：一進站就鎖著、沒有再發簡訊，說明句與引導句都要換
      if (s === 'locked-return') {
        otp.reset();
        otp.stopResendTimer();
        showLockedOnLoad();
        bindSupportLinks();   // 鎖定訊息裡的行內連結是這時才生出來的
        return;
      }

      // 2026-08-05：碼過期不再跳獨立頁，就地把說明句換成「驗證碼已失效」
      // 並讓重發變可按；輸入框刻意不鎖，使用者仍可打（只是一定驗不過）
      if (s === 'expired') {
        otp.reset();
        otp.stopResendTimer();
        otp.expire();
        return;
      }

      if (s === 'default') {
        otp.reset();
        otp.stopResendTimer();
        otp.renderResendRow('ready');
      }
      if (s === 'counting') {
        otp.reset();
        otp.startCountdown(56);
      }
      if (s === 'error') {
        otp.reset();
        otp.startCountdown(38);
        otp.fillDemo(['1','2','3','4','5','9']);
        otp.showError();
        submitBtn.disabled = false;   // 6 碼已填滿，讓使用者可以改完再送一次
      }
      if (s === 'locked') {
        otp.reset();
        otp.setAttemptsLeft(1);
        otp.fillDemo(['1','2','3','4','5','9']);
        otp.showError();
      }
    });
  });

  document.getElementById('backLink').setAttribute('href', 'F1登入頁-提案.html');

  /* 客服連結：原型沒有實際去處，先擋掉預設跳轉。
     2026-08-06 起這頁只剩一個入口——鎖定訊息裡的 .js-support，
     是 JS 動態插入 innerHTML 產生的節點，所以每次進鎖定狀態都要重掃一次 */
  function bindSupportLinks() {
    document.querySelectorAll('.js-support').forEach(function (a) {
      if (a.dataset.bound) return;
      a.dataset.bound = '1';
      a.addEventListener('click', function (e) { e.preventDefault(); });
    });
  }
  bindSupportLinks();

  // 「信任這個裝置」的天數由設定值填入，HTML 裡的 30 只是佔位
  document.getElementById('trustDays').textContent = TRUST_DEVICE_DAYS;

  // 起始狀態
  // 2026-08-04 修正：這裡原本沒呼叫 otp.reset()，導致 initOtpVerifier 裡
  // 「有效時間」的計時器（依賴 reset() 才會啟動）在真實進入頁面時從沒開始跑，
  // 只有走 demo 狀態列（每顆按鈕都會呼叫 otp.reset()）才會意外啟動
  otp.reset();
  otp.startCountdown(56);
  otp.focus();

  // ?locked=1：模擬「驗證碼已鎖定的帳號重新整理再進來」。
  // 真實系統是後端查帳號狀態，這裡只是讓 PM 看得到那個畫面
  if (/[?&]locked=1/.test(location.search)) { showLockedOnLoad(); bindSupportLinks(); }
})();
</script>
